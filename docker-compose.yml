version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-tracker}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - tracker_net

  # Sauvegarde quotidienne de la base PostgreSQL (dans ./backups/ sur le NAS) :
  # 7 jours, 4 semaines et 6 mois conservés.
  db-backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-tracker}
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - ./backups/db:/backups
    networks:
      - tracker_net

  # Sauvegarde quotidienne des fichiers .torrent et des pochettes (14 jours conservés).
  files-backup:
    image: alpine:3.20
    restart: unless-stopped
    volumes:
      - torrent_storage:/data/torrents:ro
      - cover_storage:/data/covers:ro
      - chat_file_storage:/data/chat-files:ro
      - ./backups/files:/backups
    command:
      - sh
      - -c
      - |
        while true; do
          tar czf /backups/files-$$(date +%F).tar.gz -C /data torrents covers chat-files
          find /backups -name 'files-*.tar.gz' -mtime +14 -delete
          sleep 86400
        done

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - ./backend/.env
    environment:
      # Dérivé des mêmes variables que le service postgres ci-dessus, pour
      # qu'il soit impossible que les deux divergent (source du bug P1000
      # "Authentication failed" : deux fichiers .env différents avaient
      # chacun leur propre mot de passe codé en dur).
      DATABASE_URL: postgresql://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-tracker}?schema=public
    volumes:
      - torrent_storage:/app/storage/torrents
      - cover_storage:/app/storage/covers
      - chat_file_storage:/app/storage/chat-files
    networks:
      - tracker_net
    # Pas de port exposé publiquement ici — passe par Nginx Proxy Manager
    expose:
      - "3000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Nom de domaine public du tracker (ex : venus.seeduction.org) : depuis ce nom, le site n'est jamais servi.
      TRACKER_HOST: ${TRACKER_HOST:-venus.seeduction.org}
    networks:
      - tracker_net
    ports:
      - "9098:80"     # le site (seeduction.org)
      - "9099:8081"  # le tracker seul (venus.seeduction.org) : ne sert que /tracker/

networks:
  tracker_net:
    driver: bridge

volumes:
  pg_data:
  torrent_storage:
  cover_storage:
  chat_file_storage:
