# En-têtes de sécurité envoyés avec chaque réponse du site (inclus dans le serveur et dans chaque bloc location qui pose ses propres en-têtes : nginx n'hérite pas des add_header du niveau supérieur).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
# Politique complète en MODE TEST (Report-Only) : rien n'est bloqué, mais chaque infraction est signalée au site (Admin > Monitoring). Une fois le rapport vide pendant quelques jours, on la rend obligatoire.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: data: https:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-src https://www.youtube-nocookie.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/security/csp-report" always;
